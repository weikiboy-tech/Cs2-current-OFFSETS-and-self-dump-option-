name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Release
        run: cargo build --release

      - name: Prepare Windows artifact folder
        run: |
          $bundlePath = 'SELF OFFSET DUMPER'
          New-Item -ItemType Directory -Force -Path $bundlePath
          Copy-Item -LiteralPath 'target/release/cs2-dumper.exe' -Destination (Join-Path $bundlePath 'cs2-dumper.exe') -Force
        shell: powershell

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: current-cs2-offsets-windows
          path: "SELF OFFSET DUMPER/"
