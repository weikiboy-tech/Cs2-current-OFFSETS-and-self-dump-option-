name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build release artifacts
        run: cargo build --release

      - name: Create distributable archive
        run: |
          New-Item -ItemType Directory -Force -Path publish
          Copy-Item target/release/*.exe -Destination publish/ -ErrorAction Stop
          Compress-Archive -Path publish/* -DestinationPath publish/current-cs2-offsets-windows.zip
        shell: powershell

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/current-cs2-offsets-windows.zip
