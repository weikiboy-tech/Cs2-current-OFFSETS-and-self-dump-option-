name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build release artifacts
        run: cargo build --release

      - name: Prepare Windows bundle
        run: |
          $bundlePath = 'SELF OFFSET DUMPER'
          New-Item -ItemType Directory -Force -Path $bundlePath
          Copy-Item -LiteralPath 'target/release/cs2-dumper.exe' -Destination (Join-Path $bundlePath 'cs2-dumper.exe') -Force
        shell: powershell

      - name: Create distributable archive
        run: |
          $bundlePath = 'SELF OFFSET DUMPER'
          $publishPath = 'publish'
          New-Item -ItemType Directory -Force -Path $publishPath
          Copy-Item -LiteralPath (Join-Path $bundlePath 'cs2-dumper.exe') -Destination $publishPath -Force
          Compress-Archive -LiteralPath (Join-Path $publishPath 'cs2-dumper.exe') -DestinationPath (Join-Path $publishPath 'current-cs2-offsets-windows.zip') -Force
        shell: powershell

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/current-cs2-offsets-windows.zip
